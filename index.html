 <!DOCTYPE html>
<html>
	<head>
		<style>
			html, body {
				margin: 0;
				padding: 0;

				max-width: 100vw;
				max-height: 100vh;

				overflow: hidden;
			}

			.input-container {
				height: 2rem;

				&input {
					width: 600px;
					max-width: 100vw;
				}
			}

			.media-container {
				height: calc(100vh - 2rem);
			}

			.media {
				display: block;
				max-height: 100%;
				max-width: 100%;
				object-fit: contain;
			}
		</style>
	</head>
	<body>
		<div class="input-container">
			<button onclick="updateVideoSelection()">Update Video List</button>
			<select id="video-select"></select>
			<button id="load-video" onclick="fetchVideo()" style="display: none;">Load</button>
		</div>

		<div class="media-container">
			<video id="video" class="media" controls />
		</div>

		<script>
			function updateVideoSelection() {
				fetch("http://localhost:3333/list")
					.then(parseOrThrowResponse)
					.then(updateVideoSelect)
					.catch(console.error)
			}

			function parseOrThrowResponse(r) {
				if (!r.ok) {
					throw new Error("Unable to access video list")
				}
				return r.json()
			}

			function updateVideoSelect(videos) {
				const videoSelect = document.getElementById("video-select")
				videoSelect.replaceChildren();

				for (const v of videos) {
					const o = document.createElement('option')
					o.value = v
					o.innerHTML = v
					videoSelect.appendChild(o)
				}

				const loadButton = document.getElementById("load-video")
				loadButton.style.display = videos.length > 0 ? "inline" : "none"
			}

			function fetchVideo() {
				const videoSelect = document.getElementById("video-select")
				const videoElement = document.getElementById("video")

				const filename = videoSelect.value
				const url = `http://localhost:3333/files/${filename}`

				videoElement.src = url
			}
		</script>
	</body>
</html>
